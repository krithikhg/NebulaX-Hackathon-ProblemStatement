<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrainWhisper</title>
  <meta name="theme-color" content="#0f123b">
  <meta name="description" content="Condition monitoring for Door, ACV, Rail Corrugation and SHM data.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M11 3 5 29M21 3l6 26M8.6 10h14.8M7.4 17h17.2M6.2 24h19.6' stroke='%230075ff' stroke-width='3' stroke-linecap='round' fill='none'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="layout">
    <aside class="side" id="side" aria-label="Navigation">
      <a class="brand" href="#/overview" aria-label="TrainWhisper overview">
        <svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <path d="M11 3 5 29M21 3l6 26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/>
          <path d="M8.6 10h14.8M7.4 17h17.2M6.2 24h19.6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity=".45" fill="none"/>
        </svg>
        <span class="brand-name">trainwhisper</span>
      </a>
      <nav class="menu" id="menu"></nav>
      <div class="side-card" id="export-card"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="topbar-actions">
          <span class="local" id="local-note"></span>
          <button type="button" class="btn primary" id="upload-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0-5 5m5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            Upload
          </button>
          <input type="file" id="file-input" accept=".csv,.xlsx,.xls" multiple hidden>
        </div>
      </header>
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
      <main id="content" class="content" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
    <header class="panel-head">
      <div>
        <h2 id="panel-title"></h2>
        <div class="panel-sub" id="panel-sub"></div>
      </div>
      <button type="button" class="icon-btn" id="panel-close" aria-label="Close panel">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <div class="drop-overlay" id="drop-overlay" aria-hidden="true"><div>Drop files to analyse</div></div>
  <div id="print-root" class="print-root" aria-hidden="true"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
</body>
</html>
